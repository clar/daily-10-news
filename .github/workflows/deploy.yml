name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate dates.json
        run: |
          python3 -c "
          import os, json, re, subprocess

          # Standard date-directory based sections
          sections_map = {
              'github': 'github_daily',
              'ai': 'ai_daily',
              'crypto': 'crypto_daily',
              'stock': 'stock_daily',
              'polymarket': 'polymarket_daily',
              'hackernews': 'hackernews_daily',
          }

          all_dates = set()
          date_sections = {}
          latest_commit = {}  # section_key -> latest git commit timestamp

          def get_last_commit_time(path):
              try:
                  result = subprocess.run(
                      ['git', 'log', '-1', '--format=%aI', '--', path],
                      capture_output=True, text=True, timeout=10
                  )
                  return result.stdout.strip() or None
              except:
                  return None

          for key, dir_name in sections_map.items():
              if not os.path.isdir(dir_name):
                  continue
              for d in os.listdir(dir_name):
                  if not os.path.isdir(os.path.join(dir_name, d)):
                      continue
                  all_dates.add(d)
                  date_sections.setdefault(d, []).append(key)
              t = get_last_commit_time(dir_name)
              if t:
                  latest_commit[key] = t

          # Deduplicate section lists
          for d in date_sections:
              date_sections[d] = sorted(set(date_sections[d]))

          dates_sorted = sorted(all_dates, reverse=True)

          data = {
              'dates': dates_sorted,
              'sections': {d: date_sections.get(d, []) for d in dates_sorted},
              'latest_commit': latest_commit,
          }

          with open('dates.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f'Generated dates.json with {len(dates_sorted)} dates')
          "

      - uses: actions/configure-pages@v5

      # Each attempt gets its own artifact, so retries never need to delete old ones.
      - id: pages_upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      - name: Install Pages artifact readiness probe
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: >-
          npm install --prefix "$RUNNER_TEMP/pages-artifact-probe"
          --cache "$RUNNER_TEMP/pages-npm-cache" --ignore-scripts --no-audit --no-fund
          --fetch-retries=1 --fetch-timeout=15000 @actions/artifact@2.1.3

      - name: Wait for the Pages deploy artifact listing
        timeout-minutes: 3
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const { createRequire } = require('node:module');
            const { join } = require('node:path');
            const requireProbe = createRequire(join(process.env.RUNNER_TEMP, 'pages-artifact-probe', 'package.json'));
            const { DefaultArtifactClient } = requireProbe('@actions/artifact');
            const client = new DefaultArtifactClient();
            const artifactId = Number(process.env.ARTIFACT_ID);
            const name = process.env.ARTIFACT_NAME;
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0 || !name) {
              core.setFailed('Pages upload did not return valid artifact metadata.');
              return;
            }
            // Match deploy-pages v4: list artifacts through the current run's
            // runtime artifact service, not REST's get-by-ID metadata index.
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const { artifacts } = await client.listArtifacts();
                const matches = artifacts.filter(artifact => artifact.name === name);
                if (matches.length > 1) {
                  core.setFailed(`More than one artifact named ${name} was returned.`);
                  return;
                }
                if (matches.length === 1 && Number(matches[0].id) === artifactId) {
                  core.info(`Pages deploy listing contains ${name} (ID ${artifactId}).`);
                  return;
                }
              } catch {
                core.warning('Pages deploy artifact listing unavailable; waiting before retry.');
              }
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed(`Pages deploy listing did not return ${name} (ID ${artifactId}).`);

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
